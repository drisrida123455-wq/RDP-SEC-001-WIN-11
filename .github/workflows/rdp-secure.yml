name: Windows RDP via SuperDMZ

on:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1) Install SuperDMZ and start its Windows service
      # ==========================================================
      - name: Install and Start SuperDMZ
        id: superdmz
        uses: drisrida123455-wq/RDP-SEC-001-INSTALLER-WIN-11@main
        with:
          token: ${{ secrets.SUPERDMZ_TOKEN }}


      # ==========================================================
      # 2) Enable Windows RDP
      # ==========================================================
      - name: Enable Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[2/5] Enabling Windows RDP..." -ForegroundColor Cyan

          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0

          Set-Service `
              -Name "TermService" `
              -StartupType Automatic

          Start-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop"

          Write-Host "[✓] Windows RDP enabled." -ForegroundColor Green


      # ==========================================================
      # 3) Create RDP administrator
      # ==========================================================
      - name: Create RDP Admin User
        shell: pwsh
        env:
          USER_RDP: ${{ vars.USER_RDP }}
          PASS_RDP: ${{ vars.PASS_RDP }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[3/5] Creating RDP user..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:USER_RDP)) {
              throw "USER_RDP is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PASS_RDP)) {
              throw "PASS_RDP is missing."
          }

          $username = $env:USER_RDP
          $password = $env:PASS_RDP

          $existingUser = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "[+] Removing existing user..." -ForegroundColor Yellow

              Remove-LocalUser `
                  -Name $username `
                  -ErrorAction SilentlyContinue
          }

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "RDP Admin" `
              -PasswordNeverExpires `
              -ErrorAction Stop |
              Out-Null

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction Stop

          Write-Host "[✓] RDP user created." -ForegroundColor Green
          Write-Host "[✓] Username: $username" -ForegroundColor Green


      # ==========================================================
      # 4) Verify Windows service
      # ==========================================================
      - name: Verify SuperDMZ Service
        shell: pwsh
        env:
          SUPERDMZ_SERVICE: ${{ steps.superdmz.outputs.service_name }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[4/5] Verifying SuperDMZ service..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_SERVICE)) {
              throw "SuperDMZ service output is missing."
          }

          Write-Host "[+] Service: $env:SUPERDMZ_SERVICE"

          $service = Get-Service `
              -Name $env:SUPERDMZ_SERVICE `
              -ErrorAction Stop

          if ($service.Status -ne "Running") {
              Write-Host "[-] Service is not running." -ForegroundColor Red
              throw "SuperDMZ service is not running."
          }

          Write-Host "[✓] SuperDMZ service is running." -ForegroundColor Green


      # ==========================================================
      # 5) Keep runner alive for up to 6 hours
      # ==========================================================
      - name: Live Monitoring
        shell: pwsh
        env:
          SUPERDMZ_SERVICE: ${{ steps.superdmz.outputs.service_name }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[5/5] Live monitoring started..." -ForegroundColor Cyan

          while ($true) {

              $service = Get-Service `
                  -Name $env:SUPERDMZ_SERVICE `
                  -ErrorAction SilentlyContinue

              if (-not $service) {
                  throw "SuperDMZ service disappeared."
              }

              # --------------------------------------------------
              # Restart service automatically if it stops
              # --------------------------------------------------

              if ($service.Status -ne "Running") {

                  Write-Host ""
                  Write-Host "[-] SuperDMZ service stopped." -ForegroundColor Yellow
                  Write-Host "[+] Restarting service..." -ForegroundColor Yellow

                  Restart-Service `
                      -Name $env:SUPERDMZ_SERVICE `
                      -Force `
                      -ErrorAction Stop

                  Start-Sleep -Seconds 5

                  $service = Get-Service `
                      -Name $env:SUPERDMZ_SERVICE `
                      -ErrorAction Stop

                  if ($service.Status -ne "Running") {
                      throw "SuperDMZ service failed to restart."
                  }

                  Write-Host "[✓] SuperDMZ service restarted." -ForegroundColor Green
              }

              Write-Host `
                  "[SuperDMZ] Service: $($service.Status)" `
                  -ForegroundColor Gray

              Start-Sleep -Seconds 10
          }


      # ==========================================================
      # Cleanup
      # ==========================================================
      - name: Cleanup
        if: always()
        shell: pwsh
        env:
          SUPERDMZ_SERVICE: ${{ steps.superdmz.outputs.service_name }}
        run: |
          Write-Host "[+] Cleanup..." -ForegroundColor Cyan

          if (-not [string]::IsNullOrWhiteSpace($env:SUPERDMZ_SERVICE)) {

              Stop-Service `
                  -Name $env:SUPERDMZ_SERVICE `
                  -Force `
                  -ErrorAction SilentlyContinue
          }

          Write-Host "[✓] Cleanup complete." -ForegroundColor Green
