name: Windows RDP via SuperDMZ

on:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1) Install + start SuperDMZ
      #    from the private installer repository
      # ==========================================================
      - name: Install and Start SuperDMZ
        id: superdmz
        uses: drisrida123455-wq/RDP-SEC-001-INSTALLER-WIN-11@main
        with:
          token: ${{ secrets.SUPERDMZ_TOKEN }}


      # ==========================================================
      # 2) Enable Windows RDP
      # ==========================================================
      - name: Enable Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[2/5] Enabling Windows RDP..." -ForegroundColor Cyan

          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0

          Set-Service `
              -Name "TermService" `
              -StartupType Automatic

          Start-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop"

          Write-Host "[✓] Windows RDP enabled." -ForegroundColor Green


      # ==========================================================
      # 3) Create RDP Admin User
      # ==========================================================
      - name: Create RDP Admin User
        shell: pwsh
        env:
          USER_RDP: ${{ vars.USER_RDP }}
          PASS_RDP: ${{ vars.PASS_RDP }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[3/5] Creating RDP user..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:USER_RDP)) {
              throw "USER_RDP is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PASS_RDP)) {
              throw "PASS_RDP is missing."
          }

          $username = $env:USER_RDP
          $password = $env:PASS_RDP

          Write-Host "[+] Username: $username"

          $existingUser = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "[+] Existing user found. Removing..." `
                  -ForegroundColor Yellow

              Remove-LocalUser `
                  -Name $username `
                  -ErrorAction SilentlyContinue
          }

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "RDP Admin" `
              -PasswordNeverExpires `
              -ErrorAction Stop |
              Out-Null

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction Stop

          Write-Host "[✓] RDP administrator created." `
              -ForegroundColor Green


      # ==========================================================
      # 4) Verify SuperDMZ process
      # ==========================================================
      - name: Verify SuperDMZ
        shell: pwsh
        env:
          SUPERDMZ_PID: ${{ steps.superdmz.outputs.pid }}
          SUPERDMZ_EXE: ${{ steps.superdmz.outputs.exe }}
          SUPERDMZ_OUT_LOG: ${{ steps.superdmz.outputs.out_log }}
          SUPERDMZ_ERR_LOG: ${{ steps.superdmz.outputs.err_log }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[4/5] Verifying SuperDMZ..." `
              -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_PID)) {
              throw "SUPERDMZ_PID output is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_EXE)) {
              throw "SUPERDMZ_EXE output is missing."
          }

          Write-Host "[+] PID: $env:SUPERDMZ_PID"
          Write-Host "[+] EXE: $env:SUPERDMZ_EXE"

          $process = Get-Process `
              -Id ([int]$env:SUPERDMZ_PID) `
              -ErrorAction SilentlyContinue

          if (-not $process) {

              Write-Host `
                  "[-] SuperDMZ stopped before verification." `
                  -ForegroundColor Red

              if (Test-Path $env:SUPERDMZ_OUT_LOG) {
                  Write-Host ""
                  Write-Host "===== STDOUT ====="
                  Get-Content `
                      $env:SUPERDMZ_OUT_LOG `
                      -ErrorAction SilentlyContinue
              }

              if (Test-Path $env:SUPERDMZ_ERR_LOG) {
                  Write-Host ""
                  Write-Host "===== STDERR ====="
                  Get-Content `
                      $env:SUPERDMZ_ERR_LOG `
                      -ErrorAction SilentlyContinue
              }

              throw "SuperDMZ is not running."
          }

          Write-Host "[✓] SuperDMZ is running." `
              -ForegroundColor Green

          Write-Host `
              "[✓] PID: $($process.Id)" `
              -ForegroundColor Green


      # ==========================================================
      # 5) Keep runner alive and monitor SuperDMZ
      # ==========================================================
      - name: Live Monitoring
        shell: pwsh
        env:
          SUPERDMZ_PID: ${{ steps.superdmz.outputs.pid }}
          SUPERDMZ_EXE: ${{ steps.superdmz.outputs.exe }}
          SUPERDMZ_OUT_LOG: ${{ steps.superdmz.outputs.out_log }}
          SUPERDMZ_ERR_LOG: ${{ steps.superdmz.outputs.err_log }}
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host `
              "[5/5] Live monitoring started..." `
              -ForegroundColor Cyan

          $superdmzPid = [int]$env:SUPERDMZ_PID

          while ($true) {

              # --------------------------------------------------
              # Check current process
              # --------------------------------------------------

              $process = Get-Process `
                  -Id $superdmzPid `
                  -ErrorAction SilentlyContinue

              # --------------------------------------------------
              # If SuperDMZ stopped, restart it
              # --------------------------------------------------

              if (-not $process) {

                  Write-Host `
                      "[-] SuperDMZ stopped." `
                      -ForegroundColor Yellow

                  Write-Host `
                      "[+] Restarting SuperDMZ..." `
                      -ForegroundColor Yellow

                  if (-not (Test-Path $env:SUPERDMZ_EXE)) {
                      throw "SuperDMZ executable no longer exists."
                  }

                  $newProcess = Start-Process `
                      -FilePath $env:SUPERDMZ_EXE `
                      -ArgumentList "-token `"$($env:SUPERDMZ_TOKEN)`"" `
                      -WorkingDirectory `
                          (Split-Path $env:SUPERDMZ_EXE) `
                      -RedirectStandardOutput `
                          $env:SUPERDMZ_OUT_LOG `
                      -RedirectStandardError `
                          $env:SUPERDMZ_ERR_LOG `
                      -PassThru `
                      -WindowStyle Hidden

                  Start-Sleep -Seconds 5

                  # ------------------------------------------------
                  # Verify restart
                  # ------------------------------------------------

                  if ($newProcess.HasExited) {

                      Write-Host `
                          "[-] SuperDMZ restart failed." `
                          -ForegroundColor Red

                      Write-Host `
                          "ExitCode: $($newProcess.ExitCode)" `
                          -ForegroundColor Red

                      Write-Host ""
                      Write-Host "===== STDOUT ====="

                      if (Test-Path $env:SUPERDMZ_OUT_LOG) {
                          Get-Content `
                              $env:SUPERDMZ_OUT_LOG `
                              -ErrorAction SilentlyContinue
                      }

                      Write-Host ""
                      Write-Host "===== STDERR ====="

                      if (Test-Path $env:SUPERDMZ_ERR_LOG) {
                          Get-Content `
                              $env:SUPERDMZ_ERR_LOG `
                              -ErrorAction SilentlyContinue
                      }

                      exit 1
                  }

                  $superdmzPid = $newProcess.Id

                  Write-Host `
                      "[✓] SuperDMZ restarted successfully." `
                      -ForegroundColor Green

                  Write-Host `
                      "[✓] New PID: $superdmzPid" `
                      -ForegroundColor Green
              }

              # --------------------------------------------------
              # Monitor logs
              # --------------------------------------------------

              if (Test-Path $env:SUPERDMZ_OUT_LOG) {

                  Get-Content `
                      $env:SUPERDMZ_OUT_LOG `
                      -ErrorAction SilentlyContinue |
                      Select-Object -Last 5 |
                      ForEach-Object {
                          Write-Host `
                              "[SuperDMZ] $_" `
                              -ForegroundColor Gray
                      }
              }

              if (Test-Path $env:SUPERDMZ_ERR_LOG) {

                  Get-Content `
                      $env:SUPERDMZ_ERR_LOG `
                      -ErrorAction SilentlyContinue |
                      Select-Object -Last 5 |
                      ForEach-Object {
                          Write-Host `
                              "[SuperDMZ ERR] $_" `
                              -ForegroundColor Red
                      }
              }

              # --------------------------------------------------
              # Wait before next check
              # --------------------------------------------------

              Start-Sleep -Seconds 5
          }


      # ==========================================================
      # Cleanup
      # ==========================================================
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Write-Host "[+] Cleanup..." -ForegroundColor Cyan

          Get-Process `
              -Name "SuperDMZ" `
              -ErrorAction SilentlyContinue |
              Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "[✓] Cleanup complete." `
              -ForegroundColor Green
