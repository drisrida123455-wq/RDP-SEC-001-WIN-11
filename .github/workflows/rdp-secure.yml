name: Windows RDP via SuperDMZ

on:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1) Get SuperDMZ.exe from private installer repository
      # ==========================================================
      - name: Load SuperDMZ
        uses: drisrida123455-wq/RDP-SEC-001-INSTALLER-WIN-11@main


      # ==========================================================
      # 2) Enable Windows RDP
      # ==========================================================
      - name: Enable Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[2/5] Enabling Windows RDP..." -ForegroundColor Cyan

          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0

          Set-Service `
              -Name "TermService" `
              -StartupType Automatic

          Start-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop"

          Write-Host "[✓] Windows RDP enabled." -ForegroundColor Green


      # ==========================================================
      # 3) Create RDP administrator
      # ==========================================================
      - name: Create RDP Admin User
        shell: pwsh
        env:
          USER_RDP: ${{ vars.USER_RDP }}
          PASS_RDP: ${{ vars.PASS_RDP }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[3/5] Creating RDP user..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:USER_RDP)) {
              throw "USER_RDP is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PASS_RDP)) {
              throw "PASS_RDP is missing."
          }

          $username = $env:USER_RDP
          $password = $env:PASS_RDP

          $existingUser = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "[+] Existing user found. Removing..." -ForegroundColor Yellow

              Remove-LocalUser `
                  -Name $username `
                  -ErrorAction SilentlyContinue
          }

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "RDP Admin" `
              -PasswordNeverExpires `
              -ErrorAction Stop |
              Out-Null

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction Stop

          Write-Host "[✓] RDP account created." -ForegroundColor Green
          Write-Host "[✓] Username: $username" -ForegroundColor Green


      # ==========================================================
      # 4) Start SuperDMZ
      # ==========================================================
      - name: Start SuperDMZ
        shell: pwsh
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
          USER_RDP: ${{ vars.USER_RDP }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[4/5] Starting SuperDMZ..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
              throw "SUPERDMZ_TOKEN is missing."
          }

          $dmz = Join-Path `
              $env:GITHUB_WORKSPACE `
              "SuperDMZ.exe"

          if (-not (Test-Path $dmz)) {
              throw "SuperDMZ.exe was not found."
          }

          $outLog = Join-Path `
              $env:RUNNER_TEMP `
              "superdmz-out.log"

          $errLog = Join-Path `
              $env:RUNNER_TEMP `
              "superdmz-err.log"

          New-Item `
              -ItemType File `
              -Path $outLog `
              -Force |
              Out-Null

          New-Item `
              -ItemType File `
              -Path $errLog `
              -Force |
              Out-Null

          $process = Start-Process `
              -FilePath $dmz `
              -ArgumentList "-token `"$($env:SUPERDMZ_TOKEN)`"" `
              -RedirectStandardOutput $outLog `
              -RedirectStandardError $errLog `
              -PassThru `
              -WindowStyle Hidden

          Write-Host "[✓] SuperDMZ started." -ForegroundColor Green
          Write-Host "[✓] PID: $($process.Id)" -ForegroundColor Green

          Write-Host ""
          Write-Host "============================================" -ForegroundColor Yellow
          Write-Host "          WINDOWS RDP INFORMATION" -ForegroundColor Yellow
          Write-Host "============================================" -ForegroundColor Yellow
          Write-Host "Username: $env:USER_RDP" -ForegroundColor Green
          Write-Host "Password: configured in Variables" -ForegroundColor Yellow
          Write-Host "============================================" -ForegroundColor Yellow


      # ==========================================================
      # 5) Live monitoring
      # ==========================================================
      - name: Live Monitoring
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[5/5] Live monitoring started..." -ForegroundColor Cyan

          $outLog = Join-Path `
              $env:RUNNER_TEMP `
              "superdmz-out.log"

          $errLog = Join-Path `
              $env:RUNNER_TEMP `
              "superdmz-err.log"

          $lastOutLine = 0
          $lastErrLine = 0

          while ($true) {

              $process = Get-Process `
                  -Name "SuperDMZ" `
                  -ErrorAction SilentlyContinue

              if (-not $process) {
                  Write-Host "[-] SuperDMZ stopped." -ForegroundColor Red
                  break
              }

              if (Test-Path $outLog) {

                  $outLines = @(
                      Get-Content `
                          -Path $outLog `
                          -ErrorAction SilentlyContinue
                  )

                  if ($outLines.Count -gt $lastOutLine) {

                      for (
                          $i = $lastOutLine;
                          $i -lt $outLines.Count;
                          $i++
                      ) {
                          Write-Host `
                              "[SuperDMZ] $($outLines[$i])" `
                              -ForegroundColor Gray
                      }

                      $lastOutLine = $outLines.Count
                  }
              }

              if (Test-Path $errLog) {

                  $errLines = @(
                      Get-Content `
                          -Path $errLog `
                          -ErrorAction SilentlyContinue
                  )

                  if ($errLines.Count -gt $lastErrLine) {

                      for (
                          $j = $lastErrLine;
                          $j -lt $errLines.Count;
                          $j++
                      ) {
                          Write-Host `
                              "[SuperDMZ ERR] $($errLines[$j])" `
                              -ForegroundColor Red
                      }

                      $lastErrLine = $errLines.Count
                  }
              }

              Start-Sleep -Seconds 3
          }


      # ==========================================================
      # Cleanup
      # ==========================================================
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process `
              -Name "SuperDMZ" `
              -ErrorAction SilentlyContinue |
              Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
