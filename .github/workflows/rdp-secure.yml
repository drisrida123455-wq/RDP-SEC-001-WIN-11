name: Windows RDP via SuperDMZ

on:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1) Install + extract + start SuperDMZ from private repo
      # ==========================================================
      - name: Install and Start SuperDMZ
        uses: drisrida123455-wq/RDP-SEC-001-INSTALLER-WIN-11@main
        with:
          token: ${{ secrets.SUPERDMZ_TOKEN }}


      # ==========================================================
      # 2) Enable Windows RDP
      # ==========================================================
      - name: Enable Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[2/5] Enabling Windows RDP..." -ForegroundColor Cyan

          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0

          Set-Service `
              -Name "TermService" `
              -StartupType Automatic

          Start-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop"

          Write-Host "[✓] RDP enabled." -ForegroundColor Green


      # ==========================================================
      # 3) Create RDP Administrator
      # ==========================================================
      - name: Create RDP Admin User
        shell: pwsh
        env:
          USER_RDP: ${{ vars.USER_RDP }}
          PASS_RDP: ${{ vars.PASS_RDP }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[3/5] Creating RDP user..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:USER_RDP)) {
              throw "USER_RDP is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PASS_RDP)) {
              throw "PASS_RDP is missing."
          }

          $username = $env:USER_RDP
          $password = $env:PASS_RDP

          $existingUser = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser `
                  -Name $username `
                  -ErrorAction SilentlyContinue
          }

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "RDP Admin" `
              -PasswordNeverExpires `
              -ErrorAction Stop |
              Out-Null

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction Stop

          Write-Host "[✓] RDP user created." -ForegroundColor Green
          Write-Host "[✓] Username: $username" -ForegroundColor Green


      # ==========================================================
      # 4) Verify SuperDMZ stayed alive
      # ==========================================================
      - name: Verify SuperDMZ
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[4/5] Verifying SuperDMZ..." -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_PID)) {
              throw "SUPERDMZ_PID is missing."
          }

          $process = Get-Process `
              -Id ([int]$env:SUPERDMZ_PID) `
              -ErrorAction SilentlyContinue

          if (-not $process) {

              Write-Host "[-] SuperDMZ stopped." -ForegroundColor Red

              if (Test-Path $env:SUPERDMZ_OUT_LOG) {
                  Write-Host ""
                  Write-Host "===== STDOUT ====="
                  Get-Content $env:SUPERDMZ_OUT_LOG
              }

              if (Test-Path $env:SUPERDMZ_ERR_LOG) {
                  Write-Host ""
                  Write-Host "===== STDERR ====="
                  Get-Content $env:SUPERDMZ_ERR_LOG
              }

              throw "SuperDMZ is not running."
          }

          Write-Host "[✓] SuperDMZ is running." -ForegroundColor Green
          Write-Host "[✓] PID: $($process.Id)" -ForegroundColor Green


      # ==========================================================
      # 5) Keep RDP alive for the job lifetime
      # ==========================================================
      - name: Live Monitoring
        shell: pwsh
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[5/5] Live monitoring started..." -ForegroundColor Cyan

          while ($true) {

              $process = Get-Process `
                  -Id ([int]$env:SUPERDMZ_PID) `
                  -ErrorAction SilentlyContinue

              # --------------------------------------------------
              # If SuperDMZ dies, restart it automatically
              # --------------------------------------------------

              if (-not $process) {

                  Write-Host "[-] SuperDMZ stopped. Restarting..." -ForegroundColor Yellow

                  $newProcess = Start-Process `
                      -FilePath $env:SUPERDMZ_EXE `
                      -ArgumentList "-token `"$($env:SUPERDMZ_TOKEN)`"" `
                      -WorkingDirectory (Split-Path $env:SUPERDMZ_EXE) `
                      -RedirectStandardOutput $env:SUPERDMZ_OUT_LOG `
                      -RedirectStandardError $env:SUPERDMZ_ERR_LOG `
                      -PassThru `
                      -WindowStyle Hidden

                  "SUPERDMZ_PID=$($newProcess.Id)" | Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Append `
                      -Encoding utf8

                  Start-Sleep -Seconds 5

                  if ($newProcess.HasExited) {

                      Write-Host "[-] Restart failed." -ForegroundColor Red
                      Write-Host "ExitCode: $($newProcess.ExitCode)" -ForegroundColor Red

                      if (Test-Path $env:SUPERDMZ_ERR_LOG) {
                          Get-Content $env:SUPERDMZ_ERR_LOG
                      }

                      exit 1
                  }

                  Write-Host "[✓] SuperDMZ restarted." -ForegroundColor Green
              }

              # --------------------------------------------------
              # Print new output
              # --------------------------------------------------

              if (Test-Path $env:SUPERDMZ_OUT_LOG) {

                  Get-Content `
                      $env:SUPERDMZ_OUT_LOG `
                      -ErrorAction SilentlyContinue |
                      Select-Object -Last 5 |
                      ForEach-Object {
                          Write-Host "[SuperDMZ] $_"
                      }
              }

              if (Test-Path $env:SUPERDMZ_ERR_LOG) {

                  Get-Content `
                      $env:SUPERDMZ_ERR_LOG `
                      -ErrorAction SilentlyContinue |
                      Select-Object -Last 5 |
                      ForEach-Object {
                          Write-Host "[SuperDMZ ERR] $_"
                      }
              }

              Start-Sleep -Seconds 5
          }


      # ==========================================================
      # Cleanup
      # ==========================================================
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process `
              -Name "SuperDMZ" `
              -ErrorAction SilentlyContinue |
              Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
